<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetClaw 獎池後台</title><style>body{margin:0;background:#160f20;color:#f7efff;font:16px system-ui,'Microsoft JhengHei';padding:24px}main{max-width:1150px;margin:auto}h1{color:#ffca67}button,input{font:inherit;padding:10px;border-radius:9px;border:1px solid #705382;background:#291a37;color:white}button{cursor:pointer;background:#69408a}label{display:grid;gap:6px;margin:12px 0}#login{max-width:380px;margin:60px auto}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.card{border:1px solid #674c78;background:#24172f;border-radius:16px;padding:16px;margin:14px 0}.fields{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px}.fields input{width:100%;box-sizing:border-box}img{max-width:110px;max-height:110px;object-fit:contain}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #50375e;text-align:left;font-size:14px}.scroll{overflow:auto}#message{white-space:pre-wrap;color:#ffcd76;position:sticky;top:0;background:#160f20;padding:10px}small,p{color:#cbb6d9}a{color:#ffca67}@media(max-width:650px){body{padding:12px}.fields{grid-template-columns:1fr 1fr}}</style><main><h1>PetClaw 驚喜球後台</h1><a href="/">開啟遊戲</a><div id="message" role="status"></div><form id="login"><h2>管理員登入</h2><label>帳號<input name="username" autocomplete="username" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" required></label><button>登入</button></form><section id="panel" hidden><div class="toolbar"><button id="add">新增獎品</button><button id="save">儲存獎池</button><button id="refresh">重新整理紀錄</button><button id="logout">登出</button></div><p>每次抓取 10 示範 credits。MISS 率決定半途鬆爪的機率；成功抓出後，再依獎品權重分配。售完或停用的獎品不參與分配。</p><label>MISS／鬆爪率 %（0 = 必中，100 = 必定鬆爪）<input id="missRate" type="number" min="0" max="100" step="0.1" value="70"></label><label>累積消費保夾（credits，10 的倍數；0 關閉）<input id="guaranteeCost" type="number" min="0" max="100000" step="10" value="150"></label><p>累積至門檻的當次必定抓中，優先於 MISS 率；任何一次中獎後重新累積。沒有可用獎品時停止抽獎、不扣點。</p><strong id="probability"></strong><div id="prizes"></div><h2>抽獎統計</h2><p id="stats"></p><h2>最近 500 筆抽獎紀錄</h2><p>匿名玩家依瀏覽器識別；伺服器保存全部紀錄。每筆均保存當時獎池機率與庫存快照。</p><div class="scroll"><table><thead><tr><th>時間</th><th>玩家</th><th>結果</th><th>扣點</th><th>獎池快照</th></tr></thead><tbody id="draws"></tbody></table></div><h2>最近獎池變更</h2><div id="audit"></div></section></main><script src="/admin.js" defer></script></html>
